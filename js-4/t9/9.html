<!DOCTYPE html>
<html>
<head>
    <title>DOM Example</title>
</head>
<body>

    <p id="message">Original text</p>

    <button id="btn">Click Me</button>

    <script>
        let button = document.getElementById("btn");

        button.addEventListener("click", function() {
            document.getElementById("message").innerText =
                "Text has changed!";
        });
    </script>

</body>
</html>
